<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5d0201"/>
      <stop offset="100%" stop-color="#8a0c0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f9e29d"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Emblem Icon: Modern Architectural Pentagon / Lotus / Tech Diamond -->
  <g transform="translate(10, 10)" filter="url(#subtleShadow)">
    <circle cx="50" cy="50" r="48" fill="url(#primaryGrad)" />
    <!-- Outer decorative ring -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-dasharray="4,2"/>
    
    <!-- Geometric Architecture Symbol: Interlocking pillars and digital gateway -->
    <path d="M50 18 L76 34 L76 66 L50 82 L24 66 L24 34 Z" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M50 26 L68 38 L68 62 L50 74 L32 62 L32 38 Z" fill="rgba(212, 175, 55, 0.2)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <!-- Central Tech Node / Compass -->
    <line x1="50" y1="26" x2="50" y2="74" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="32" y1="50" x2="68" y2="50" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="50" cy="50" r="5" fill="#ffffff"/>
    <circle cx="50" cy="50" r="2.5" fill="#5d0201"/>
    <!-- Digital nodes -->
    <circle cx="50" cy="18" r="3" fill="url(#goldGrad)"/>
    <circle cx="76" cy="34" r="3" fill="url(#goldGrad)"/>
    <circle cx="76" cy="66" r="3" fill="url(#goldGrad)"/>
    <circle cx="50" cy="82" r="3" fill="url(#goldGrad)"/>
    <circle cx="24" cy="66" r="3" fill="url(#goldGrad)"/>
    <circle cx="24" cy="34" r="3" fill="url(#goldGrad)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(120, 25)">
    <!-- Main Brand Name -->
    <text x="0" y="36" font-family="'Lato', 'Montserrat', 'Segoe UI', sans-serif" font-size="34" font-weight="900" fill="#5d0201" letter-spacing="3.5">KIEN LAC</text>
    <text x="175" y="36" font-family="'Lato', 'Montserrat', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#d4af37" letter-spacing="2">DIDI CENTER</text>
    
    <!-- Subtitle / Mission line -->
    <text x="0" y="58" font-family="'Roboto', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#333333" letter-spacing="0.5">TRUNG TÂM NGHIÊN CỨU, THIẾT KẾ TÍCH HỢP SỐ &amp; ĐỔI MỚI SÁNG TẠO</text>
    <text x="0" y="73" font-family="'Roboto', 'Segoe UI', sans-serif" font-size="9.5" font-weight="500" fill="#666666" letter-spacing="0.3">VIỆN NGHIÊN CỨU CHIẾN LƯỢC VÀ PHÁT TRIỂN LẠC HỒNG</text>
  </g>
</svg>
