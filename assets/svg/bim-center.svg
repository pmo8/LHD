<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bimBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="bimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1000" height="600" rx="16" fill="url(#bimBg)"/>

  <!-- Subtle Blueprint Tech lines -->
  <g stroke="rgba(245, 158, 11, 0.15)" stroke-width="1">
    <circle cx="500" cy="300" r="140" fill="none" stroke-dasharray="4,6"/>
    <circle cx="500" cy="300" r="220" fill="none" stroke-dasharray="6,8"/>
    <circle cx="500" cy="300" r="270" fill="none" stroke-dasharray="2,8"/>
    <line x1="100" y1="300" x2="900" y2="300"/>
    <line x1="500" y1="50" x2="500" y2="550"/>
  </g>

  <!-- Title Banner -->
  <text x="500" y="55" font-family="'Lato', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    MÔ HÌNH TƯ DUY "HẠT NHÂN HÓA" ĐA TÍCH HỢP
  </text>
  <text x="500" y="82" font-family="'Roboto', sans-serif" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="middle" letter-spacing="1">
    ĐỀ XUẤT KHỞI XƯỚNG BIM CENTER — WORK TO LEARN, NOT TO EARN
  </text>

  <!-- Central Hub: Kien Lac DIDI BIM Core -->
  <circle cx="500" cy="300" r="75" fill="url(#accentRed)" stroke="#f59e0b" stroke-width="3" filter="url(#bimGlow)"/>
  <text x="500" y="285" font-family="'Lato', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">BIM CENTER</text>
  <text x="500" y="305" font-family="'Lato', sans-serif" font-size="12" font-weight="700" fill="#fef08a" text-anchor="middle">HẠT NHÂN HÓA</text>
  <text x="500" y="325" font-family="'Roboto', sans-serif" font-size="10" font-weight="500" fill="#e4e4e7" text-anchor="middle">Agile Feedback Loop</text>

  <!-- Orbit Satellites -->
  <!-- 1. 3D Model & Architecture (Top) -->
  <g transform="translate(500, 130)">
    <rect x="-100" y="-30" width="200" height="60" rx="10" fill="#27272a" stroke="#0ea5e9" stroke-width="2"/>
    <text x="0" y="-5" font-family="'Lato', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">3D/4D/5D BIM</text>
    <text x="0" y="15" font-family="'Roboto', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Thiết kế &amp; Dự toán động</text>
  </g>

  <!-- 2. Common Data Environment CDE (Right Top) -->
  <g transform="translate(750, 210)">
    <rect x="-90" y="-30" width="180" height="60" rx="10" fill="#27272a" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="-5" font-family="'Lato', sans-serif" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">MÔI TRƯỜNG CDE</text>
    <text x="0" y="15" font-family="'Roboto', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Dữ liệu nguồn duy nhất</text>
  </g>

  <!-- 3. Quản lý Điều Hành PMO (Right Bottom) -->
  <g transform="translate(750, 390)">
    <rect x="-90" y="-30" width="180" height="60" rx="10" fill="#27272a" stroke="#f59e0b" stroke-width="2"/>
    <text x="0" y="-5" font-family="'Lato', sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">ĐIỀU HÀNH PMO</text>
    <text x="0" y="15" font-family="'Roboto', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Tiến độ &amp; Rủi ro thời gian thực</text>
  </g>

  <!-- 4. Digital Twins & Smart City (Bottom) -->
  <g transform="translate(500, 470)">
    <rect x="-100" y="-30" width="200" height="60" rx="10" fill="#27272a" stroke="#a855f7" stroke-width="2"/>
    <text x="0" y="-5" font-family="'Lato', sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">DIGITAL TWINS</text>
    <text x="0" y="15" font-family="'Roboto', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Mô phỏng &amp; Vận hành đô thị</text>
  </g>

  <!-- 5. Trí Lực - Sinh Lực - Thể Lực (Left Bottom) -->
  <g transform="translate(250, 390)">
    <rect x="-90" y="-30" width="180" height="60" rx="10" fill="#27272a" stroke="#ec4899" stroke-width="2"/>
    <text x="0" y="-5" font-family="'Lato', sans-serif" font-size="13" font-weight="700" fill="#f472b6" text-anchor="middle">CON NGƯỜI PMO</text>
    <text x="0" y="15" font-family="'Roboto', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Trí Lực, Sinh Lực &amp; Kỷ Luật</text>
  </g>

  <!-- 6. Đổi Mới Sáng Tạo & R&D (Left Top) -->
  <g transform="translate(250, 210)">
    <rect x="-90" y="-30" width="180" height="60" rx="10" fill="#27272a" stroke="#06b6d4" stroke-width="2"/>
    <text x="0" y="-5" font-family="'Lato', sans-serif" font-size="13" font-weight="700" fill="#22d3ee" text-anchor="middle">ĐỔI MỚI SÁNG TẠO</text>
    <text x="0" y="15" font-family="'Roboto', sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Viện nghiên cứu Lạc Hồng</text>
  </g>

  <!-- Connecting Lines with arrows -->
  <path d="M500 225 L500 160" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M555 250 L660 210" stroke="#f59e0b" stroke-width="2"/>
  <path d="M555 350 L660 390" stroke="#f59e0b" stroke-width="2"/>
  <path d="M500 375 L500 440" stroke="#f59e0b" stroke-width="2"/>
  <path d="M445 350 L340 390" stroke="#f59e0b" stroke-width="2"/>
  <path d="M445 250 L340 210" stroke="#f59e0b" stroke-width="2"/>

  <!-- Footer Tagline -->
  <text x="500" y="555" font-family="'Roboto', sans-serif" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="middle">
    Góp Trí Lực, Sinh Lực và Thể Lực kiến tạo nên hình hài đô thị và tương lai phát triển bền vững của thương hiệu Việt
  </text>
</svg>
